services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    volumes:
      - gateway-data:/data
    depends_on:
      - jaeger
  # Traces UI: http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"
volumes:
  gateway-data:
